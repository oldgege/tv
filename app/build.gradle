apply plugin: 'com.android.application'
apply plugin: 'org.greenrobot.greendao'

greendao {
    //数据库版本号
    schemaVersion 1
    //greendao插件自动生成的代码的包名
    //daoPackage android.defaultConfig.applicationId
    //greendao插件自动生成的代码保存路径
    //targetGenDir 'src/main/java'
    //是否生成单元测试代码
    generateTests false
    //生成测试源码的路径
    //targetGenDirTests 'src/androidTest/java'
}

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.wengyj.tv"
        minSdkVersion 18
        targetSdkVersion 28
        versionCode 6
        versionName "6"
    }

    signingConfigs {
        config {
            keyAlias 'wengyj'
            keyPassword 'wengyj'
            storeFile file('./../wengyj_jks.jks')
            storePassword 'wengyj'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
        debug {
            signingConfig signingConfigs.config
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // ========== 自定义 APK 输出文件名 ==========
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // 获取版本信息
            def versionCode = variant.versionCode
            def versionName = variant.versionName
            // 获取当前日期：年月日
            def date = new Date().format("yyyyMMdd")
            // 自定义文件名：versionCode_versionName_年月日.apk
            outputFileName = "V${versionCode}_${date}.apk"
        }
    }
    // =========================================
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'   // 会传递引入 fragment 1.3+
    // 建议显式声明
    implementation 'androidx.fragment:fragment:1.3.6'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}